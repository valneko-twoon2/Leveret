[package]
name = "leveret"
version = "0.1.0"
description = "A simple Git client"
authors = ["valneko-twoon2"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "leveret_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
thiserror = "2"
tempfile = "3"
encoding_rs = "0.8"
# GitHub API (blocking; called from worker threads)
ureq = { version = "2.12", features = ["json"] }
# Stores the GitHub token in Windows Credential Manager
keyring = { version = "3", features = ["windows-native"] }
base64 = "0.22"
tauri-plugin-opener = "2"
trash = "5"
dirs = "7"

[target.'cfg(windows)'.dependencies]
# Must match the versions used by tauri/wry (used for WebView2 screen capture).
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
# Panics keep the default unwinding: a panic inside a command becomes an error
# for that command instead of taking the whole app down.
# Thin LTO: a rebuild takes 110 s instead of 265 s; the exe is 2.5 MB larger.
lto = "thin"
codegen-units = 16
strip = true

# Debug builds (dev, test, clippy) skip debug information: it made target/ grow to
# tens of GB and slowed linking. Line tables keep panic backtraces readable.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
